name: ci
on:
  push:
    branches: [main]
  pull_request:

# The token only reads repository contents. The check job adds actions: write
# because setup-node saves the npm cache through actions/cache.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04  # playwright-core 1.56 has no build for 26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # cf needs Node ^22.23, ^24.22 or ^26.12. A bare major can resolve to an older cached release.
          node-version: 24.22
          cache: npm
      - run: node tools/check-glyph.ts
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install numpy
      # mermaid itself is the oracle for the flowchart parser
      - run: npm i --no-save mermaid@11.4.1
      # the mermaid oracle runs in headless Chromium (tools/lib/browser.ts)
      - run: npx playwright-core install --with-deps --only-shell chromium
      # manim itself is the oracle for test/manim.test.ts (tools/oracle/manim_math.py)
      - run: git clone --depth 1 https://github.com/3b1b/manim.git /tmp/manim && git -C /tmp/manim fetch --depth 1 origin fafa083a4fb274bba9cabde0b6e2f50ba6da0622 && git -C /tmp/manim checkout -q fafa083a4fb274bba9cabde0b6e2f50ba6da0622
      - run: npm run check          # tsc -b over every project (emits dist/); compile a TS consumer against it
      - run: npm run test:full      # every frame, 400 random scenes, cache validation, goldens, oracles, bare runtime, leaks
        env:
          MANIM_DIR: /tmp/manim
          MERMAID_JS: node_modules/mermaid/dist/mermaid.min.js
      - run: npm run verify:motion  # no teleports, pops or cuts in any scene
      - run: npm run build
      # Builds the Worker with out/site/ as its assets and validates the upload. No credentials, no API calls.
      - run: npx cf deploy --dry-run
# The playback gate (npm run verify:playback) measures frame pacing in a real
# browser. Shared runners are too noisy for a 1% late-frame budget, so it runs
# locally before merging changes to the renderer or player.
